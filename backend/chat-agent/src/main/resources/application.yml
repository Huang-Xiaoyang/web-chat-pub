spring:
  config:
    import: optional:file:./.env.properties
  application:
    name: chat-agent
  
  datasource:
    url: jdbc:mysql://localhost:3306/chatdb?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:1}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      timeout: 5000ms

deepseek:
  api:
    base-url: ${DEEPSEEK_BASE_URL}
    api-key: ${DEEPSEEK_API_KEY}
    model: ${DEEPSEEK_MODEL}
  
server:
  port: ${SERVER_PORT:8443}
  ssl:
    key-store: ${SSL_KEY_STORE:***}  
    key-store-password: ${SSL_PASSWORD:***}    
    key-store-type: PKCS12             
    key-alias: ${SSL_ALIAS:myalias}               

logging:
  level:
    com.chat.chat_agent: DEBUG          
